spring:
  config:
    # Local development: picks BOT_TOKEN and friends up from an untracked .env file.
    # Real environment variables still win, which is what Docker and the host use.
    import: optional:file:.env[.properties]
  application:
    name: tandoor
  threads:
    virtual:
      enabled: true
  datasource:
    # H2 file mode in PostgreSQL dialect on the 0.5 GB tier; set DB_URL to a real
    # PostgreSQL JDBC URL on a tier with more memory without touching the code.
    url: ${DB_URL:jdbc:h2:file:./data/tandoor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  data:
    jdbc:
      # H2 runs in PostgreSQL mode with lower-case identifiers; the H2 dialect would upper-case them.
      dialect: postgresql
  flyway:
    enabled: true
    locations: classpath:db/migration

telegram:
  token: ${BOT_TOKEN:}
  channel-id: ${CHANNEL_ID:}

bakery:
  timezone: ${BAKERY_TZ:Europe/Moscow}
  bootstrap-admins: ${BOOTSTRAP_ADMINS:}

logging:
  level:
    dubrava.tandoor: INFO
